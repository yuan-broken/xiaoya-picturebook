<!DOCTYPE html>

<html class="w-full min-h-full bg-[#f7f3ec]" lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>互动故事营 · 小芽绘本</title><script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script><script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script></head>
<body class="m-0 min-h-screen bg-[#f7f3ec] text-[#24312e]"><div class="mx-auto flex min-h-screen max-w-[1440px] overflow-hidden bg-[#fbfaf7] shadow-[0_12px_60px_rgba(61,48,29,.08)]"><aside class="hidden w-[248px] shrink-0 border-r border-[#ebe5db] bg-[#f5f1e9] px-5 py-7 lg:block"><a class="flex items-center gap-3 px-2" href="home.html"><span class="flex h-10 w-10 items-center justify-center rounded-2xl bg-[#ef765e] text-white"><iconify-icon icon="lucide:book-open-check" width="22"></iconify-icon></span><span><strong class="block text-lg leading-5">小芽绘本</strong><small class="text-[11px] text-[#83908b]">AI 伴读成长空间</small></span></a><div class="mt-12 px-3 text-[11px] font-semibold tracking-[.18em] text-[#a09c91]">我的空间</div><nav class="mt-3 space-y-1 text-sm"><a class="flex items-center gap-3 rounded-xl px-3 py-3 text-[#68746f]" href="home.html"><iconify-icon icon="lucide:layout-dashboard" width="18"></iconify-icon>今日首页</a><a class="flex items-center gap-3 rounded-xl px-3 py-3 text-[#68746f]" href="library.html"><iconify-icon icon="lucide:library" width="18"></iconify-icon>绘本库</a><a class="flex items-center gap-3 rounded-xl bg-white px-3 py-3 font-semibold text-[#ef765e] shadow-sm" href="studio.html"><iconify-icon icon="lucide:sparkles" width="18"></iconify-icon>互动故事营<span class="ml-auto rounded-full bg-[#dff2e9] px-2 py-0.5 text-[10px] text-[#3b9273]">AI</span></a><a class="flex items-center gap-3 rounded-xl px-3 py-3 text-[#68746f]" href="reader.html"><iconify-icon icon="lucide:headphones" width="18"></iconify-icon>最近伴读</a></nav><div class="mt-12 rounded-2xl bg-[#e3f1ec] p-4"><div class="flex justify-between text-xs font-semibold text-[#3d7868]"><span>今日创作</span><iconify-icon icon="lucide:leaf" width="18"></iconify-icon></div><div class="mt-3 text-2xl font-bold text-[#2d6658]">2 <span class="text-sm font-normal">个故事</span></div><p class="mt-3 text-[11px] leading-5 text-[#668a7e]">小芽很喜欢你的新点子</p></div></aside><main class="flex-1 overflow-y-auto"><header class="flex h-[76px] items-center justify-between border-b border-[#eee9e1] px-6 md:px-10"><div class="flex items-center gap-3 lg:hidden"><span class="flex h-9 w-9 items-center justify-center rounded-xl bg-[#ef765e] text-white"><iconify-icon icon="lucide:book-open-check" width="19"></iconify-icon></span><b>小芽绘本</b></div><div id="headerHint" class="hidden text-sm text-[#7e8881] md:block">互动故事营 · 孩子的想象力工作室</div><a class="text-xs font-semibold text-[#78827d]" href="home.html">返回首页</a></header><div class="px-6 py-8 md:px-10 md:py-10"><div class="flex flex-col justify-between gap-5 md:flex-row md:items-end"><div><span class="text-xs font-bold tracking-[.18em] text-[#4e9b7c]">AI INTERACTIVE CAMP</span><h1 class="mt-2 text-3xl font-bold tracking-tight">今天，想和谁一起冒险？</h1><p class="mt-3 text-sm text-[#7f8983]">先选一个伙伴，再用声音或文字告诉他你的故事。</p></div><div class="flex items-center gap-2 rounded-xl bg-[#f1eee7] p-1 text-xs"><button class="mode rounded-lg bg-white px-3 py-2 font-bold text-[#ef765e] shadow-sm" onclick="switchMode('create',this)">创造角色</button><button class="mode rounded-lg px-3 py-2 text-[#7b8580]" onclick="switchMode('chat',this)">和角色聊天</button></div></div><div class="mt-8 grid gap-6 lg:grid-cols-[1fr_360px]" id="create"><section class="rounded-3xl border border-[#eee9e1] bg-white p-6 md:p-8"><div class="flex items-center justify-between"><h2 class="text-lg font-bold">① 选择你的故事伙伴</h2><span class="text-xs text-[#a0a7a2]">可随时更换</span></div><div class="mt-5 grid grid-cols-3 gap-3 sm:grid-cols-6"><button class="role rounded-2xl border-2 border-[#ef765e] bg-[#fff7f3] p-3 text-center" onclick="pickRole(this,'森林小狐')"><span class="text-4xl">🦊</span><small class="mt-2 block text-[11px] font-bold">森林小狐</small></button><button class="role rounded-2xl border border-[#eee9e1] p-3 text-center" onclick="pickRole(this,'星星兔')"><span class="text-4xl">🐰</span><small class="mt-2 block text-[11px]">星星兔</small></button><button class="role rounded-2xl border border-[#eee9e1] p-3 text-center" onclick="pickRole(this,'海底鲸')"><span class="text-4xl">🐳</span><small class="mt-2 block text-[11px]">海底鲸</small></button><button class="role rounded-2xl border border-[#eee9e1] p-3 text-center" onclick="pickRole(this,'云朵龙')"><span class="text-4xl">🐲</span><small class="mt-2 block text-[11px]">云朵龙</small></button><button class="role rounded-2xl border border-[#eee9e1] p-3 text-center" onclick="pickRole(this,'月亮猫')"><span class="text-4xl">🐱</span><small class="mt-2 block text-[11px]">月亮猫</small></button><button class="rounded-2xl border border-dashed border-[#d6d0c5] p-3 text-center text-[#a0a7a2] hover:border-[#ef765e] hover:text-[#ef765e]" onclick="customRole()"><iconify-icon icon="lucide:plus" width="25"></iconify-icon><small class="mt-2 block text-[11px]">自定义</small></button></div><h2 class="mt-9 text-lg font-bold">② 故事从哪里开始？</h2><div class="mt-4 flex flex-wrap gap-2"><button class="prompt rounded-full bg-[#e5f3ed] px-4 py-2 text-xs font-semibold text-[#42866e]" onclick="usePrompt(this)">去森林找彩虹</button><button class="prompt rounded-full bg-[#fff0da] px-4 py-2 text-xs font-semibold text-[#b47739]" onclick="usePrompt(this)">第一次上学</button><button class="prompt rounded-full bg-[#eee9f7] px-4 py-2 text-xs font-semibold text-[#73629a]" onclick="usePrompt(this)">月球野餐会</button></div><textarea class="mt-4 h-28 w-full resize-none rounded-2xl border border-[#e7e0d6] bg-[#fcfbf8] p-4 text-sm outline-none placeholder:text-[#b1b7b2] focus:border-[#ef765e]" id="idea" placeholder="也可以直接说说你的想法，比如：我想和小狐一起帮助迷路的小鸟……"></textarea><div class="mt-6 flex items-center justify-between"><span class="flex items-center gap-2 text-xs text-[#8d9690]"><iconify-icon class="text-[#4e9b7c]" icon="lucide:shield-check" width="16"></iconify-icon>内容适合 2-12 岁儿童</span><button class="flex items-center gap-2 rounded-xl bg-[#ef765e] px-5 py-3 text-sm font-bold text-white shadow-md" onclick="generateStory()"><iconify-icon icon="lucide:wand-sparkles" width="16"></iconify-icon>生成我的故事</button></div></section><aside class="rounded-3xl bg-[#e8f3ed] p-6"><span class="text-xs font-bold text-[#4e9b7c]">角色预览</span><div class="flex min-h-[280px] flex-col items-center justify-center text-center"><div class="flex h-36 w-36 items-center justify-center rounded-[42%] bg-[#f6c49b] text-8xl shadow-[0_14px_25px_rgba(55,110,86,.14)]" id="avatar">🦊</div><h3 class="mt-5 text-xl font-bold text-[#285e50]" id="roleName">森林小狐</h3><p class="mt-2 max-w-[220px] text-xs leading-5 text-[#6b8d81]">“嗨！我会陪你勇敢地探索每一个新地方。”</p></div><div class="flex items-center gap-2 rounded-2xl bg-white/70 p-3 text-xs text-[#628277]"><iconify-icon icon="lucide:mic-2" width="17"></iconify-icon>生成后可以直接语音对话</div></aside></div><div class="hidden mt-8 max-w-[780px] rounded-3xl border border-[#eee9e1] bg-white p-6 md:p-8" id="chat"><h2 class="text-lg font-bold">和 <span class="text-[#ef765e]">森林小狐</span> 聊一聊</h2><div class="mt-5 space-y-3" id="messages"><div class="flex gap-3"><span class="text-2xl">🦊</span><div class="rounded-2xl rounded-tl-none bg-[#e8f3ed] px-4 py-3 text-sm leading-6">你今天想去哪里探险？我已经准备好耳朵啦。</div></div></div><div class="mt-6 flex items-center gap-2 rounded-2xl border border-[#e7e0d6] p-2"><button class="flex h-10 w-10 items-center justify-center rounded-xl bg-[#fff0e9] text-[#ef765e]" onclick="speak()"><iconify-icon icon="lucide:mic" width="18"></iconify-icon></button><input class="flex-1 px-2 text-sm outline-none" id="chatInput" placeholder="输入想对角色说的话"/><button class="rounded-xl bg-[#ef765e] px-4 py-2 text-xs font-bold text-white" onclick="sendChat()">发送</button></div></div></div></main></div><script>function switchMode(id,btn){document.getElementById('create').classList.toggle('hidden',id!=='create');document.getElementById('chat').classList.toggle('hidden',id!=='chat');document.querySelectorAll('.mode').forEach(x=>{x.classList.remove('bg-white','font-bold','text-[#ef765e]','shadow-sm');x.classList.add('text-[#7b8580]')});btn.classList.remove('text-[#7b8580]');btn.classList.add('bg-white','font-bold','text-[#ef765e]','shadow-sm')}function pickRole(btn,name){document.querySelectorAll('.role').forEach(x=>{x.classList.remove('border-2','border-[#ef765e]','bg-[#fff7f3]');x.classList.add('border','border-[#eee9e1]')});btn.classList.remove('border','border-[#eee9e1]');btn.classList.add('border-2','border-[#ef765e]','bg-[#fff7f3]');document.getElementById('roleName').textContent=name;var spanEl=btn.querySelector('span');var imgEl=btn.querySelector('img');var avatar=document.getElementById('avatar');if(imgEl){avatar.innerHTML='';avatar.appendChild(imgEl.cloneNode(true));avatar.classList.remove('text-8xl')}else if(spanEl){avatar.textContent=spanEl.textContent;avatar.classList.add('text-8xl')}}function usePrompt(btn){document.getElementById('idea').value=btn.textContent+'，我想和伙伴一起完成一个小任务。'}function customRole(){showCustomRoleModal()}
function showCustomRoleModal(){var m=document.getElementById('customRoleModal');if(!m){m=document.createElement('div');m.id='customRoleModal';m.className='fixed inset-0 z-50 flex items-center justify-center bg-black/30';m.innerHTML='<div class="w-96 rounded-2xl bg-white p-6 shadow-xl"><h3 class="text-lg font-bold">自定义角色</h3><div class="mt-4"><label class="text-xs font-bold text-[#68746f]">角色名称</label><input id="customRoleName" type="text" placeholder="如：小老虎" class="mt-2 w-full rounded-xl border border-[#eee9e1] px-4 py-2 text-sm" oninput="document.getElementById(\'customRoleAvatarBtn\').style.display=this.value.trim()?\'flex\':\'none\'"/></div><div class="mt-4"><label class="text-xs font-bold text-[#68746f]">头像方式</label><div class="mt-2 flex gap-2"><button class="flex-1 rounded-xl border border-[#eee9e1] px-3 py-2 text-xs font-bold text-[#68746f] hover:border-[#ef765e] toggleAvatarMode active" data-mode="emoji" onclick="switchAvatarMode(\'emoji\')">Emoji 表情</button><button class="flex-1 rounded-xl border border-[#eee9e1] px-3 py-2 text-xs font-bold text-[#68746f] hover:border-[#ef765e]" data-mode="ai" onclick="switchAvatarMode(\'ai\')">AI 生成头像</button></div></div><div id="avatarEmojiSection"><input id="customRoleEmoji" type="text" placeholder="如：🐯" class="mt-2 w-full rounded-xl border border-[#eee9e1] px-4 py-2 text-sm"/><div class="mt-2 flex flex-wrap gap-1.5" id="emojiSuggestions">'+['🐱','🐶','🐰','🐯','🐻','🐼','🦊','🐨','🐸','🐵','🦁','🐮'].map(function(e){return '<button class="rounded-lg bg-[#f5f1e9] px-2 py-1 text-lg hover:bg-[#eee9e1]" onclick="document.getElementById(\'customRoleEmoji\').value=\''+e+'\'">'+e+'</button>'}).join('')+'</div></div><div id="avatarAiSection" class="hidden mt-2"><div class="flex items-center gap-2"><button id="customRoleAvatarBtn" class="flex w-full items-center justify-center gap-2 rounded-xl bg-[#ef765e] px-4 py-2.5 text-xs font-bold text-white hover:bg-[#e0654d]" style="display:none" onclick="generateAvatar()"><iconify-icon icon="lucide:sparkles" width="15"></iconify-icon>用 AI 生成头像</button></div><div id="avatarPreview" class="mt-3 hidden flex-col items-center"><div class="relative"><img id="avatarImg" class="h-28 w-28 rounded-full border-4 border-[#ef765e] object-cover" alt="头像"/><button class="absolute -right-1 -top-1 flex h-7 w-7 items-center justify-center rounded-full bg-white shadow-md hover:bg-[#f5f1e9]" onclick="generateAvatar()"><iconify-icon icon="lucide:refresh-cw" width="14"></iconify-icon></button></div><p class="mt-2 text-[11px] text-[#9aa29d]">点击刷新重新生成</p></div><p id="avatarLoading" class="mt-3 hidden text-center text-xs text-[#9aa29d]">小芽正在绘制头像...</p></div><div class="mt-5 flex justify-end gap-2"><button class="rounded-xl px-4 py-2 text-xs text-[#9aa29d]" onclick="document.getElementById(\'customRoleModal\').remove()">取消</button><button class="rounded-xl bg-[#ef765e] px-4 py-2 text-xs font-bold text-white" onclick="confirmCustomRole()">创建角色</button></div></div>';document.body.appendChild(m)}m.classList.remove('hidden');document.getElementById('customRoleAvatarBtn').style.display='none'}
function switchAvatarMode(mode){document.querySelectorAll('.toggleAvatarMode').forEach(function(b){b.classList.remove('active','border-[#ef765e]','bg-[#fff7f3]','text-[#ef765e]')});document.querySelector('[data-mode="'+mode+'"]').classList.add('active','border-[#ef765e]','bg-[#fff7f3]','text-[#ef765e]');document.getElementById('avatarEmojiSection').classList.toggle('hidden',mode!=='emoji');document.getElementById('avatarAiSection').classList.toggle('hidden',mode!=='ai')}
function generateAvatar(){var name=document.getElementById('customRoleName').value.trim();if(!name){toast('请先输入角色名称');return}var loading=document.getElementById('avatarLoading');var preview=document.getElementById('avatarPreview');loading.classList.remove('hidden');preview.classList.add('hidden');var prompt='可爱的卡通'+name+'角色头像，圆润风格，儿童绘本插画，柔和色彩，正面肖像，简单背景，适合幼儿';var url='https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt='+encodeURIComponent(prompt)+'&image_size=square_hd';var img=document.getElementById('avatarImg');img.onload=function(){loading.classList.add('hidden');preview.classList.remove('hidden');preview.classList.add('flex');toast('头像生成成功！')};img.onerror=function(){loading.classList.add('hidden');toast('头像生成失败，请用 Emoji 代替')};img.src=url}
function confirmCustomRole(){var name=document.getElementById('customRoleName').value.trim();if(!name){toast('请输入角色名称');return}var box=document.querySelector('.role').parentElement;var btn=document.createElement('button');btn.className='role flex flex-col items-center rounded-2xl border border-[#eee9e1] bg-white p-3 text-center hover:border-[#ef765e] cursor-pointer';btn.onclick=function(){pickRole(this,name)};var aiImg=document.getElementById('avatarImg');var emojiVal=document.getElementById('customRoleEmoji').value.trim()||'🐱';var aiMode=document.querySelector('[data-mode="ai"]').classList.contains('active');if(aiMode&&aiImg&&aiImg.src&&aiImg.complete&&aiImg.naturalWidth>0){btn.innerHTML='<img class="h-10 w-10 rounded-full object-cover mx-auto" src="'+aiImg.src+'" alt="'+name+'"/><small class="mt-2 block text-[11px]">'+name+'</small>'}else{btn.innerHTML='<span class="text-3xl">'+emojiVal+'</span><small class="mt-2 block text-[11px]">'+name+'</small>'}box.insertBefore(btn,box.lastElementChild);pickRole(btn,name);document.getElementById('customRoleModal').remove();toast('自定义角色「'+name+'」已创建！')}function generateStory(){var idea=document.getElementById('idea').value.trim()||'去森林找彩虹';var roleName=document.getElementById('roleName').textContent;var avatar=document.getElementById('avatar');var avatarImg=avatar.querySelector('img');var avatarHTML=avatarImg?'<img src="'+avatarImg.src+'" class="h-14 w-14 rounded-full object-cover"/>'+avatarImg.outerHTML:'<span class="text-5xl">'+avatar.textContent+'</span>';var storyId='story_'+Date.now();var storyPanel=document.getElementById('storyPanel');if(!storyPanel){storyPanel=document.createElement('div');storyPanel.id='storyPanel';storyPanel.className='mt-8 rounded-3xl border border-[#eee9e1] bg-white p-6 md:p-8';document.getElementById('create').appendChild(storyPanel)}storyPanel.innerHTML='<div class="flex items-center gap-3"><div class="flex h-14 w-14 items-center justify-center rounded-full bg-[#f6c49b] text-5xl">'+avatarHTML+'</div><div><h3 class="text-lg font-bold">'+roleName+'的故事</h3><p class="text-xs text-[#9aa29d]">基于「'+idea+'」生成 · 刚刚</p></div><button class="ml-auto rounded-xl bg-[#f5f1e9] px-3 py-2 text-xs text-[#68746f] hover:bg-[#eee9e1]" onclick="document.getElementById(\'storyPanel\').remove()">关闭</button></div><div class="mt-5 flex items-center gap-2 text-xs text-[#9aa29d]"><iconify-icon icon="lucide:loader-2" width="14" class="animate-spin" id="storySpinner"></iconify-icon><span id="storyStatus">小芽正在创作「'+idea+'」的专属故事...</span></div><div class="mt-4 space-y-3" id="storyContent"></div><div class="mt-5 hidden flex items-center gap-2" id="storyActions"><button class="flex items-center gap-2 rounded-xl bg-[#ef765e] px-4 py-2 text-xs font-bold text-white hover:bg-[#e0654d]" onclick="speakStory()"><iconify-icon icon="lucide:volume-2" width="14"></iconify-icon>朗读故事</button><button class="flex items-center gap-2 rounded-xl bg-[#f5f1e9] px-4 py-2 text-xs font-bold text-[#68746f] hover:bg-[#eee9e1]" onclick="window.location.href=\'reader.html?bookId=1\'"><iconify-icon icon="lucide:book-open" width="14"></iconify-icon>打开绘本阅读</button><button class="flex items-center gap-2 rounded-xl bg-[#e8f3ed] px-4 py-2 text-xs font-bold text-[#4e9b7c] hover:bg-[#d4ebde]" onclick="switchMode(\'chat\',document.querySelectorAll(\'.mode\')[1])"><iconify-icon icon="lucide:message-circle" width="14"></iconify-icon>和角色聊这个故事</button></div>';storyPanel.classList.remove('hidden');var steps=[{t:800,text:'第一章 · 遇见'+roleName+'<p class=\"text-sm leading-6 text-[#5a6660] mt-2\">阳光穿过树叶的缝隙，洒在森林的小路上。'+roleName+'正坐在一棵老橡树下，等待着一个新朋友的到来。"你好呀！"'+roleName+'笑着说，"我等你好久了，快过来！"</p>'},{t:1800,text:'第二章 · '+idea+'<p class=\"text-sm leading-6 text-[#5a6660] mt-2\">我们沿着小河往前走，河水的声音像在唱歌。'+roleName+'说："你听，小河在告诉我们什么？"仔细一听，原来小河在说：勇敢的孩子，前面有一道彩虹在等你呢！</p>'},{t:2800,text:'第三章 · 小小的冒险<p class=\"text-sm leading-6 text-[#5a6660] mt-2\">路上有一座小桥，桥下流水潺潺。'+roleName+'鼓励道："别怕，我陪你一起走过去！"你深吸一口气，一步步稳稳地走过小桥。'+roleName+'在对面开心地为你鼓掌。</p>'},{t:3800,text:'第四章 · 找到彩虹<p class=\"text-sm leading-6 text-[#5a6660] mt-2\">终于，我们来到了一片开阔的草地，天空中真的有一道大大的彩虹！'+roleName+'说："你看，我们做到了！"彩虹下面，还有一盆闪亮的小礼物，是小河送给勇敢的你的。</p>'},{t:4500,done:true,text:'<p class=\"text-sm leading-6 text-[#5a6660]\">故事讲完啦！'+roleName+'想和你聊聊这次冒险，你也可以让小芽朗读这个故事，或者去绘本库看看更多精彩绘本。</p>'}];var content=document.getElementById('storyContent');var status=document.getElementById('storyStatus');var spinner=document.getElementById('storySpinner');var actions=document.getElementById('storyActions');steps.forEach(function(s,i){setTimeout(function(){content.insertAdjacentHTML('beforeend','<div class="rounded-2xl bg-[#fcfbf8] p-4">'+s.text+'</div>');content.lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'});if(s.done){status.textContent='故事已生成！';spinner.className='';spinner.setAttribute('icon','lucide:check-circle');spinner.classList.add('text-[#4e9b7c]');actions.classList.remove('hidden');actions.classList.add('flex');toast('故事已生成！'+roleName+'在等你继续聊天哦～')}},s.t)})}var storySpeakBtn=null;function speakStory(){if(!('speechSynthesis' in window)){toast('当前浏览器不支持语音朗读');return}if(speakStory._playing){speechSynthesis.cancel();speakStory._playing=false;restoreSpeakBtn();toast('已停止朗读');return}var panels=document.querySelectorAll('#storyContent > div');var text='';panels.forEach(function(p){text+=p.textContent+' '});if(!text.trim()){toast('暂无可朗读的内容');return}var u=new SpeechSynthesisUtterance(text.replace(/第[一二三四五六七八九十]+章/g,''));u.lang='zh-CN';u.rate=0.9;u.pitch=1.1;u.onend=function(){speakStory._playing=false;restoreSpeakBtn();toast('朗读结束')};u.onerror=function(){speakStory._playing=false;restoreSpeakBtn()};speechSynthesis.speak(u);speakStory._playing=true;var btn=document.querySelector('button[onclick="speakStory()"]');if(btn){storySpeakBtn=btn;btn.dataset.originalHTML=btn.innerHTML;btn.innerHTML='<iconify-icon icon="lucide:square" width="14"></iconify-icon>停止朗读';btn.classList.remove('bg-[#ef765e]','hover:bg-[#e0654d]');btn.classList.add('bg-[#c44b3a]','hover:bg-[#b03d2d]')}toast('开始朗读故事')}function restoreSpeakBtn(){if(storySpeakBtn&&storySpeakBtn.dataset.originalHTML){storySpeakBtn.innerHTML=storySpeakBtn.dataset.originalHTML;storySpeakBtn.classList.remove('bg-[#c44b3a]','hover:bg-[#b03d2d]');storySpeakBtn.classList.add('bg-[#ef765e]','hover:bg-[#e0654d]');storySpeakBtn=null}}function sendChat(){const input=document.getElementById('chatInput');if(!input.value.trim())return;const box=document.getElementById('messages');box.insertAdjacentHTML('beforeend','<div class="flex justify-end"><div class="rounded-2xl rounded-tr-none bg-[#fff0e9] px-4 py-3 text-sm">'+input.value+'</div></div><div class="flex gap-3"><span class="text-2xl">🦊</span><div class="rounded-2xl rounded-tl-none bg-[#e8f3ed] px-4 py-3 text-sm">听起来真有趣！我们一起出发吧。</div></div>');input.value=''}function speak(){toast('正在聆听，你可以开始说话啦')}function toast(msg){var t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='fixed bottom-6 left-1/2 z-[100] -translate-x-1/2 rounded-xl bg-[#24312e] px-4 py-2 text-xs font-semibold text-white shadow-lg transition-opacity duration-300';document.body.appendChild(t)}t.textContent=msg;t.style.opacity='1';clearTimeout(t._timer);t._timer=setTimeout(function(){t.style.opacity='0'},2000)}
function applyRoleUI(){var user={};try{user=JSON.parse(localStorage.getItem('picturebook_user')||'{}')}catch(e){}var isChild=user.role==='child';var isParent=user.role==='parent'||(!user.role&&localStorage.getItem('picturebook_token'));var hint=document.getElementById('headerHint');var backLink=document.querySelector('header a[href="home.html"]');if(isChild){if(hint){hint.textContent=(user.nickname||user.username||'小朋友')+'，开始你的创作吧！'}if(backLink){backLink.textContent='我的首页'}toast('欢迎'+(user.nickname||user.username||'小朋友')+'来到互动故事营！')}else if(isParent){if(hint){hint.textContent='家长模式 · 观看孩子的创作空间'}if(backLink){backLink.textContent='返回首页'}}}
applyRoleUI()</script></body></html>

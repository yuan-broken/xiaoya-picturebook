<body class="m-0 min-h-screen bg-[#f7f3ec] text-[#24312e]"><div class="mx-auto flex min-h-screen max-w-[1440px] overflow-hidden bg-[#fbfaf7] shadow-[0_12px_60px_rgba(61,48,29,.08)]"><aside class="hidden w-[248px] shrink-0 border-r border-[#ebe5db] bg-[#f5f1e9] px-5 py-7 lg:block"><a class="flex items-center gap-3 px-2" href="home.html"><span class="flex h-10 w-10 items-center justify-center rounded-2xl bg-[#ef765e] text-white"><iconify-icon icon="lucide:book-open-check" width="22"></iconify-icon></span><span><strong class="block text-lg leading-5">小芽绘本</strong><small class="text-[11px] text-[#83908b]">AI 伴读成长空间</small></span></a><div class="mt-12 px-3 text-[11px] font-semibold tracking-[.18em] text-[#a09c91]">我的空间</div><nav class="mt-3 space-y-1 text-sm"><a class="flex items-center gap-3 rounded-xl px-3 py-3 text-[#68746f]" href="home.html"><iconify-icon icon="lucide:layout-dashboard" width="18"></iconify-icon>今日首页</a><a class="flex items-center gap-3 rounded-xl px-3 py-3 text-[#68746f]" href="library.html"><iconify-icon icon="lucide:library" width="18"></iconify-icon>绘本库</a><a class="flex items-center gap-3 rounded-xl bg-white px-3 py-3 font-semibold text-[#ef765e] shadow-sm" href="studio.html"><iconify-icon icon="lucide:sparkles" width="18"></iconify-icon>互动故事营<span class="ml-auto rounded-full bg-[#dff2e9] px-2 py-0.5 text-[10px] text-[#3b9273]">AI</span></a><a class="flex items-center gap-3 rounded-xl px-3 py-3 text-[#68746f]" href="reader.html"><iconify-icon icon="lucide:headphones" width="18"></iconify-icon>最近伴读</a></nav><div class="mt-12 rounded-2xl bg-[#e3f1ec] p-4"><div class="flex justify-between text-xs font-semibold text-[#3d7868]"><span>今日创作</span><iconify-icon icon="lucide:leaf" width="18"></iconify-icon></div><div class="mt-3 text-2xl font-bold text-[#2d6658]">2 <span class="text-sm font-normal">个故事</span></div><p class="mt-3 text-[11px] leading-5 text-[#668a7e]">小芽很喜欢你的新点子</p></div></aside><main class="flex-1 overflow-y-auto"><header class="flex h-[76px] items-center justify-between border-b border-[#eee9e1] px-6 md:px-10"><div class="flex items-center gap-3 lg:hidden"><span class="flex h-9 w-9 items-center justify-center rounded-xl bg-[#ef765e] text-white"><iconify-icon icon="lucide:book-open-check" width="19"></iconify-icon></span><b>小芽绘本</b></div><div id="headerHint" class="hidden text-sm text-[#7e8881] md:block">互动故事营 · 孩子的想象力工作室</div><a class="text-xs font-semibold text-[#78827d]" href="home.html">返回首页</a></header><div class="px-6 py-8 md:px-10 md:py-10"><div class="flex flex-col justify-between gap-5 md:flex-row md:items-end"><div><span class="text-xs font-bold tracking-[.18em] text-[#4e9b7c]">AI INTERACTIVE CAMP</span><h1 class="mt-2 text-3xl font-bold tracking-tight">今天，想和谁一起冒险？</h1><p class="mt-3 text-sm text-[#7f8983]">先选一个伙伴，再用声音或文字告诉他你的故事。</p></div><div class="flex items-center gap-2 rounded-xl bg-[#f1eee7] p-1 text-xs"><button class="mode rounded-lg bg-white px-3 py-2 font-bold text-[#ef765e] shadow-sm" onclick="switchMode('create',this)">创造角色</button><button class="mode rounded-lg px-3 py-2 text-[#7b8580]" onclick="switchMode('chat',this)">和角色聊天</button></div></div><div class="mt-8 grid gap-6 lg:grid-cols-[1fr_360px]" id="create"><section class="rounded-3xl border border-[#eee9e1] bg-white p-6 md:p-8"><div class="flex items-center justify-between"><h2 class="text-lg font-bold">① 选择你的故事伙伴</h2><span class="text-xs text-[#a0a7a2]">可随时更换</span></div><div class="mt-5 grid grid-cols-3 gap-3 sm:grid-cols-6"><button class="role rounded-2xl border-2 border-[#ef765e] bg-[#fff7f3] p-3 text-center" onclick="pickRole(this,'森林小狐')"><span class="text-4xl">🦊</span><small class="mt-2 block text-[11px] font-bold">森林小狐</small></button><button class="role rounded-2xl border border-[#eee9e1] p-3 text-center" onclick="pickRole(this,'星星兔')"><span class="text-4xl">🐰</span><small class="mt-2 block text-[11px]">星星兔</small></button><button class="role rounded-2xl border border-[#eee9e1] p-3 text-center" onclick="pickRole(this,'海底鲸')"><span class="text-4xl">🐳</span><small class="mt-2 block text-[11px]">海底鲸</small></button><button class="role rounded-2xl border border-[#eee9e1] p-3 text-center" onclick="pickRole(this,'云朵龙')"><span class="text-4xl">🐲</span><small class="mt-2 block text-[11px]">云朵龙</small></button><button class="role rounded-2xl border border-[#eee9e1] p-3 text-center" onclick="pickRole(this,'月亮猫')"><span class="text-4xl">🐱</span><small class="mt-2 block text-[11px]">月亮猫</small></button><button class="rounded-2xl border border-dashed border-[#d6d0c5] p-3 text-center text-[#a0a7a2] hover:border-[#ef765e] hover:text-[#ef765e]" onclick="customRole()"><iconify-icon icon="lucide:plus" width="25"></iconify-icon><small class="mt-2 block text-[11px]">自定义</small></button></div><h2 class="mt-9 text-lg font-bold">② 故事从哪里开始？</h2><div class="mt-4 flex flex-wrap gap-2"><button class="prompt rounded-full bg-[#e5f3ed] px-4 py-2 text-xs font-semibold text-[#42866e]" onclick="usePrompt(this)">去森林找彩虹</button><button class="prompt rounded-full bg-[#fff0da] px-4 py-2 text-xs font-semibold text-[#b47739]" onclick="usePrompt(this)">第一次上学</button><button class="prompt rounded-full bg-[#eee9f7] px-4 py-2 text-xs font-semibold text-[#73629a]" onclick="usePrompt(this)">月球野餐会</button></div><textarea class="mt-4 h-28 w-full resize-none rounded-2xl border border-[#e7e0d6] bg-[#fcfbf8] p-4 text-sm outline-none placeholder:text-[#b1b7b2] focus:border-[#ef765e]" id="idea" placeholder="也可以直接说说你的想法，比如：我想和小狐一起帮助迷路的小鸟……"></textarea><div class="mt-6 flex items-center justify-between"><span class="flex items-center gap-2 text-xs text-[#8d9690]"><iconify-icon class="text-[#4e9b7c]" icon="lucide:shield-check" width="16"></iconify-icon>内容适合 2-12 岁儿童</span><button class="flex items-center gap-2 rounded-xl bg-[#ef765e] px-5 py-3 text-sm font-bold text-white shadow-md" onclick="generateStory()"><iconify-icon icon="lucide:wand-sparkles" width="16"></iconify-icon>生成我的故事</button></div></section><aside class="rounded-3xl bg-[#e8f3ed] p-6"><span class="text-xs font-bold text-[#4e9b7c]">角色预览</span><div class="flex min-h-[280px] flex-col items-center justify-center text-center"><div class="flex h-36 w-36 items-center justify-center rounded-[42%] bg-[#f6c49b] text-8xl shadow-[0_14px_25px_rgba(55,110,86,.14)]" id="avatar">🦊</div><h3 class="mt-5 text-xl font-bold text-[#285e50]" id="roleName">森林小狐</h3><p class="mt-2 max-w-[220px] text-xs leading-5 text-[#6b8d81]">“嗨！我会陪你勇敢地探索每一个新地方。”</p></div><div class="flex items-center gap-2 rounded-2xl bg-white/70 p-3 text-xs text-[#628277]"><iconify-icon icon="lucide:mic-2" width="17"></iconify-icon>生成后可以直接语音对话</div></aside></div><div class="hidden mt-8 max-w-[780px] rounded-3xl border border-[#eee9e1] bg-white p-6 md:p-8" id="chat"><h2 class="text-lg font-bold">和 <span class="text-[#ef765e]" id="chatRoleName">森林小狐</span> 聊一聊</h2><div class="mt-5 space-y-3" id="messages"><div class="flex gap-3"><span class="text-2xl">🦊</span><div class="rounded-2xl rounded-tl-none bg-[#e8f3ed] px-4 py-3 text-sm leading-6">你今天想去哪里探险？我已经准备好耳朵啦。</div></div></div><div class="mt-6 flex items-center gap-2 rounded-2xl border border-[#e7e0d6] p-2"><button class="flex h-10 w-10 items-center justify-center rounded-xl bg-[#fff0e9] text-[#ef765e]" onclick="speak()"><iconify-icon icon="lucide:mic" width="18"></iconify-icon></button><input class="flex-1 px-2 text-sm outline-none" id="chatInput" placeholder="输入想对角色说的话"/><button class="rounded-xl bg-[#ef765e] px-4 py-2 text-xs font-bold text-white" onclick="sendChat()">发送</button></div></div></div></main></div><script>var ROLE_ID_MAP={'森林小狐':1,'星星兔':2,'海底鲸':3,'云朵龙':4,'月亮猫':5};var chatSessionMap={};var speakMediaRecorder=null;var speakChunks=[];var speakStream=null;function switchMode(id,btn){document.getElementById('create').classList.toggle('hidden',id!=='create');document.getElementById('chat').classList.toggle('hidden',id!=='chat');document.querySelectorAll('.mode').forEach(x=>{x.classList.remove('bg-white','font-bold','text-[#ef765e]','shadow-sm');x.classList.add('text-[#7b8580]')});btn.classList.remove('text-[#7b8580]');btn.classList.add('bg-white','font-bold','text-[#ef765e]','shadow-sm')}function pickRole(btn,name){document.querySelectorAll('.role').forEach(x=>{x.classList.remove('border-2','border-[#ef765e]','bg-[#fff7f3]');x.classList.add('border','border-[#eee9e1]')});btn.classList.remove('border','border-[#eee9e1]');btn.classList.add('border-2','border-[#ef765e]','bg-[#fff7f3]');document.getElementById('roleName').textContent=name;var spanEl=btn.querySelector('span');var imgEl=btn.querySelector('img');var avatar=document.getElementById('avatar');if(imgEl){avatar.innerHTML='';avatar.appendChild(imgEl.cloneNode(true));avatar.classList.remove('text-8xl')}else if(spanEl){avatar.textContent=spanEl.textContent;avatar.classList.add('text-8xl')}updateChatForRole(name)}function usePrompt(btn){document.getElementById('idea').value=btn.textContent+'，我想和伙伴一起完成一个小任务。'}function customRole(){showCustomRoleModal()}function updateChatForRole(name){var titleSpan=document.getElementById('chatRoleName');if(titleSpan)titleSpan.textContent=name;var msgBox=document.getElementById('messages');if(!msgBox)return;var avatarEl=document.getElementById('avatar');var avatarImg=avatarEl.querySelector('img');var avatarHTML=avatarImg?'<img src="'+avatarImg.src+'" class="h-6 w-6 rounded-full object-cover"/>':avatarEl.textContent;var greetings={'森林小狐':'你今天想去哪里探险？我已经准备好耳朵啦。','星星兔':'今晚的星星好亮呀，你想聊点什么？','海底鲸':'海底的世界好大好大，你想和我聊什么呢？','云朵龙':'我刚刚从云朵上飞下来，你想聊什么呀？','月亮猫':'喵～月光下的夜晚最适合聊天了，你想说什么？'};var greet=greetings[name]||'你好呀！我是'+name+'，我们一起聊聊天吧～';msgBox.innerHTML='<div class="flex gap-3"><span class="text-2xl">'+avatarHTML+'</span><div class="rounded-2xl rounded-tl-none bg-[#e8f3ed] px-4 py-3 text-sm leading-6">'+greet+'</div></div>';var input=document.getElementById('chatInput');if(input)input.value=''}
function showCustomRoleModal(){var m=document.getElementById('customRoleModal');if(!m){m=document.createElement('div');m.id='customRoleModal';m.className='fixed inset-0 z-50 flex items-center justify-center bg-black/30';m.innerHTML='<div class="w-96 rounded-2xl bg-white p-6 shadow-xl"><h3 class="text-lg font-bold">自定义角色</h3><div class="mt-4"><label class="text-xs font-bold text-[#68746f]">角色名称</label><input id="customRoleName" type="text" placeholder="如：小老虎" class="mt-2 w-full rounded-xl border border-[#eee9e1] px-4 py-2 text-sm" oninput="document.getElementById(\'customRoleAvatarBtn\').style.display=this.value.trim()?\'flex\':\'none\'"/></div><div class="mt-4"><label class="text-xs font-bold text-[#68746f]">头像方式</label><div class="mt-2 flex gap-2"><button class="flex-1 rounded-xl border border-[#eee9e1] px-3 py-2 text-xs font-bold text-[#68746f] hover:border-[#ef765e] toggleAvatarMode active" data-mode="emoji" onclick="switchAvatarMode(\'emoji\')">Emoji 表情</button><button class="flex-1 rounded-xl border border-[#eee9e1] px-3 py-2 text-xs font-bold text-[#68746f] hover:border-[#ef765e]" data-mode="ai" onclick="switchAvatarMode(\'ai\')">AI 生成头像</button></div></div><div id="avatarEmojiSection"><input id="customRoleEmoji" type="text" placeholder="如：🐯" class="mt-2 w-full rounded-xl border border-[#eee9e1] px-4 py-2 text-sm"/><div class="mt-2 flex flex-wrap gap-1.5" id="emojiSuggestions">'+['🐱','🐶','🐰','🐯','🐻','🐼','🦊','🐨','🐸','🐵','🦁','🐮'].map(function(e){return '<button class="rounded-lg bg-[#f5f1e9] px-2 py-1 text-lg hover:bg-[#eee9e1]" onclick="document.getElementById(\'customRoleEmoji\').value=\''+e+'\'">'+e+'</button>'}).join('')+'</div></div><div id="avatarAiSection" class="hidden mt-2"><div class="flex items-center gap-2"><button id="customRoleAvatarBtn" class="flex w-full items-center justify-center gap-2 rounded-xl bg-[#ef765e] px-4 py-2.5 text-xs font-bold text-white hover:bg-[#e0654d]" style="display:none" onclick="generateAvatar()"><iconify-icon icon="lucide:sparkles" width="15"></iconify-icon>用 AI 生成头像</button></div><div id="avatarPreview" class="mt-3 hidden flex-col items-center"><div class="relative"><img id="avatarImg" class="h-28 w-28 rounded-full border-4 border-[#ef765e] object-cover" alt="头像"/><button class="absolute -right-1 -top-1 flex h-7 w-7 items-center justify-center rounded-full bg-white shadow-md hover:bg-[#f5f1e9]" onclick="generateAvatar()"><iconify-icon icon="lucide:refresh-cw" width="14"></iconify-icon></button></div><p class="mt-2 text-[11px] text-[#9aa29d]">点击刷新重新生成</p></div><p id="avatarLoading" class="mt-3 hidden text-center text-xs text-[#9aa29d]">小芽正在绘制头像...</p></div><div class="mt-5 flex justify-end gap-2"><button class="rounded-xl px-4 py-2 text-xs text-[#9aa29d]" onclick="document.getElementById(\'customRoleModal\').remove()">取消</button><button class="rounded-xl bg-[#ef765e] px-4 py-2 text-xs font-bold text-white" onclick="confirmCustomRole()">创建角色</button></div></div>';document.body.appendChild(m)}m.classList.remove('hidden');document.getElementById('customRoleAvatarBtn').style.display='none'}
function switchAvatarMode(mode){document.querySelectorAll('.toggleAvatarMode').forEach(function(b){b.classList.remove('active','border-[#ef765e]','bg-[#fff7f3]','text-[#ef765e]')});document.querySelector('[data-mode="'+mode+'"]').classList.add('active','border-[#ef765e]','bg-[#fff7f3]','text-[#ef765e]');document.getElementById('avatarEmojiSection').classList.toggle('hidden',mode!=='emoji');document.getElementById('avatarAiSection').classList.toggle('hidden',mode!=='ai')}
function generateAvatar(){var name=document.getElementById('customRoleName').value.trim();if(!name){toast('请先输入角色名称');return}var loading=document.getElementById('avatarLoading');var preview=document.getElementById('avatarPreview');loading.classList.remove('hidden');preview.classList.add('hidden');var prompt='Q版可爱的'+name+'，chibi萌系风格，圆润造型，儿童绘本插画，柔和马卡龙色彩，正面视图，纯色简单背景，适合幼儿';var img=document.getElementById('avatarImg');if(typeof API==='undefined'||!API.ai||!API.ai.imageGenerate){toast('API 未加载');loading.classList.add('hidden');return}API.ai.imageGenerate(prompt).then(function(res){var url=res&&res.data&&res.data.url;if(!url){throw new Error('无图片URL')}img.onload=function(){loading.classList.add('hidden');preview.classList.remove('hidden');preview.classList.add('flex');toast('头像生成成功！')};img.onerror=function(){loading.classList.add('hidden');toast('头像加载失败，请重试')};img.src=url}).catch(function(e){console.error('头像生成失败',e);loading.classList.add('hidden');toast('AI 头像生成失败，请用 Emoji 代替')})}
function confirmCustomRole(){var name=document.getElementById('customRoleName').value.trim();if(!name){toast('请输入角色名称');return}var box=document.querySelector('.role').parentElement;var btn=document.createElement('button');btn.className='role flex flex-col items-center rounded-2xl border border-[#eee9e1] bg-white p-3 text-center hover:border-[#ef765e] cursor-pointer';btn.onclick=function(){pickRole(this,name)};var aiImg=document.getElementById('avatarImg');var emojiVal=document.getElementById('customRoleEmoji').value.trim()||'🐱';var aiMode=document.querySelector('[data-mode="ai"]').classList.contains('active');if(aiMode&&aiImg&&aiImg.src&&aiImg.complete&&aiImg.naturalWidth>0){btn.innerHTML='<img class="h-10 w-10 rounded-full object-cover mx-auto" src="'+aiImg.src+'" alt="'+name+'"/><small class="mt-2 block text-[11px]">'+name+'</small>'}else{btn.innerHTML='<span class="text-3xl">'+emojiVal+'</span><small class="mt-2 block text-[11px]">'+name+'</small>'}box.insertBefore(btn,box.lastElementChild);pickRole(btn,name);document.getElementById('customRoleModal').remove();toast('自定义角色「'+name+'」已创建！')}function generateStory(){var idea=document.getElementById('idea').value.trim()||'去森林找彩虹';var roleName=document.getElementById('roleName').textContent;var roleId=ROLE_ID_MAP[roleName];var avatar=document.getElementById('avatar');var avatarImg=avatar.querySelector('img');var avatarHTML=avatarImg?'<img src="'+avatarImg.src+'" class="h-14 w-14 rounded-full object-cover"/>'+avatarImg.outerHTML:'<span class="text-5xl">'+avatar.textContent+'</span>';var storyPanel=document.getElementById('storyPanel');if(!storyPanel){storyPanel=document.createElement('div');storyPanel.id='storyPanel';storyPanel.className='mt-8 rounded-3xl border border-[#eee9e1] bg-white p-6 md:p-8';document.getElementById('create').appendChild(storyPanel)}storyPanel.innerHTML='<div class="flex items-center gap-3"><div class="flex h-14 w-14 items-center justify-center rounded-full bg-[#f6c49b] text-5xl">'+avatarHTML+'</div><div><h3 class="text-lg font-bold">'+roleName+'的故事</h3><p class="text-xs text-[#9aa29d]">基于「'+idea+'」生成 · 刚刚</p></div><button class="ml-auto rounded-xl bg-[#f5f1e9] px-3 py-2 text-xs text-[#68746f] hover:bg-[#eee9e1]" onclick="document.getElementById(\'storyPanel\').remove()">关闭</button></div><div class="mt-5 flex items-center gap-2 text-xs text-[#9aa29d]"><iconify-icon icon="lucide:loader-2" width="14" class="animate-spin" id="storySpinner"></iconify-icon><span id="storyStatus">小芽正在创作「'+idea+'」的专属故事...</span></div><div class="mt-4 space-y-3" id="storyContent"></div><div class="mt-5 hidden flex items-center gap-2" id="storyActions"><button class="flex items-center gap-2 rounded-xl bg-[#ef765e] px-4 py-2 text-xs font-bold text-white hover:bg-[#e0654d]" onclick="speakStory()"><iconify-icon icon="lucide:volume-2" width="14"></iconify-icon>朗读故事</button><button class="flex items-center gap-2 rounded-xl bg-[#e8f3ed] px-4 py-2 text-xs font-bold text-[#4e9b7c] hover:bg-[#d4ebde]" onclick="switchMode(\'chat\',document.querySelectorAll(\'.mode\')[1])"><iconify-icon icon="lucide:message-circle" width="14"></iconify-icon>和角色聊这个故事</button></div>';storyPanel.classList.remove('hidden');var content=document.getElementById('storyContent');var status=document.getElementById('storyStatus');var spinner=document.getElementById('storySpinner');var actions=document.getElementById('storyActions');if(typeof API==='undefined'||!API.story){mockGenerateStory(roleName,idea,content,status,spinner,actions);return}API.story.generate(roleId,roleName,null,idea).then(function(res){if(res&&res.data&&res.data.storyContent){var storyText=res.data.storyContent;renderStoryFromAI(storyText,roleName,idea,content,status,spinner,actions)}else if(res&&res.data&&res.data.content){renderStoryFromAI(res.data.content,roleName,idea,content,status,spinner,actions)}else{mockGenerateStory(roleName,idea,content,status,spinner,actions)}}).catch(function(e){console.error('故事生成失败',e);mockGenerateStory(roleName,idea,content,status,spinner,actions);toast('AI 服务暂不可用，使用示例故事')})}function renderStoryFromAI(storyText,roleName,idea,content,status,spinner,actions){var lines=storyText.split('\n').filter(function(l){return l.trim()});var delay=0;lines.forEach(function(line,i){setTimeout(function(){var clean=line.replace(/第\d+页[：:]/g,'').trim();if(!clean)return;var chapter=clean.length>20?'片段':'第'+(i+1)+'章';content.insertAdjacentHTML('beforeend','<div class="rounded-2xl bg-[#fcfbf8] p-4"><div class="text-sm font-bold text-[#285e50]">'+chapter+'</div><p class="text-sm leading-6 text-[#5a6660] mt-2">'+clean+'</p></div>');content.lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'})},delay);delay+=600});setTimeout(function(){status.textContent='故事已生成！';spinner.className='';spinner.setAttribute('icon','lucide:check-circle');spinner.classList.add('text-[#4e9b7c]');actions.classList.remove('hidden');actions.classList.add('flex');toast('故事已生成！'+roleName+'在等你继续聊天哦～')},delay+500)}function mockGenerateStory(roleName,idea,content,status,spinner,actions){var steps=[{t:800,text:'第一章 · 遇见'+roleName+'<p class=\"text-sm leading-6 text-[#5a6660] mt-2\">阳光穿过树叶的缝隙，洒在森林的小路上。'+roleName+'正坐在一棵老橡树下，等待着一个新朋友的到来。</p>'},{t:1800,text:'第二章 · '+idea+'<p class=\"text-sm leading-6 text-[#5a6660] mt-2\">我们沿着小河往前走，河水的声音像在唱歌。'+roleName+'说："你听，小河在告诉我们什么？"</p>'},{t:2800,text:'第三章 · 小小的冒险<p class=\"text-sm leading-6 text-[#5a6660] mt-2\">路上有一座小桥，桥下流水潺潺。'+roleName+'鼓励道："别怕，我陪你一起走过去！"</p>'},{t:3800,text:'第四章 · 找到彩虹<p class=\"text-sm leading-6 text-[#5a6660] mt-2\">终于，天空中真的有一道大大的彩虹！'+roleName+'说："你看，我们做到了！"</p>'},{t:4500,done:true,text:'<p class=\"text-sm leading-6 text-[#5a6660]\">故事讲完啦！'+roleName+'想和你聊聊这次冒险。</p>'}];steps.forEach(function(s,i){setTimeout(function(){content.insertAdjacentHTML('beforeend','<div class="rounded-2xl bg-[#fcfbf8] p-4">'+s.text+'</div>');content.lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'});if(s.done){status.textContent='故事已生成！';spinner.className='';spinner.setAttribute('icon','lucide:check-circle');spinner.classList.add('text-[#4e9b7c]');actions.classList.remove('hidden');actions.classList.add('flex');toast('故事已生成！')}} ,s.t)})}var storySpeakBtn=null;function speakStory(){if(!('speechSynthesis' in window)){toast('当前浏览器不支持语音朗读');return}if(speakStory._playing){speechSynthesis.cancel();speakStory._playing=false;restoreSpeakBtn();toast('已停止朗读');return}var panels=document.querySelectorAll('#storyContent > div');var text='';panels.forEach(function(p){text+=p.textContent+' '});if(!text.trim()){toast('暂无可朗读的内容');return}var u=new SpeechSynthesisUtterance(text.replace(/第[一二三四五六七八九十]+章/g,''));u.lang='zh-CN';u.rate=0.9;u.pitch=1.1;u.onend=function(){speakStory._playing=false;restoreSpeakBtn();toast('朗读结束')};u.onerror=function(){speakStory._playing=false;restoreSpeakBtn()};speechSynthesis.speak(u);speakStory._playing=true;var btn=document.querySelector('button[onclick="speakStory()"]');if(btn){storySpeakBtn=btn;btn.dataset.originalHTML=btn.innerHTML;btn.innerHTML='<iconify-icon icon="lucide:square" width="14"></iconify-icon>停止朗读';btn.classList.remove('bg-[#ef765e]','hover:bg-[#e0654d]');btn.classList.add('bg-[#c44b3a]','hover:bg-[#b03d2d]')}toast('开始朗读故事')}function restoreSpeakBtn(){if(storySpeakBtn&&storySpeakBtn.dataset.originalHTML){storySpeakBtn.innerHTML=storySpeakBtn.dataset.originalHTML;storySpeakBtn.classList.remove('bg-[#c44b3a]','hover:bg-[#b03d2d]');storySpeakBtn.classList.add('bg-[#ef765e]','hover:bg-[#e0654d]');storySpeakBtn=null}}function sendChat(){const input=document.getElementById('chatInput');if(!input.value.trim())return;const text=input.value.trim();const box=document.getElementById('messages');const roleName=document.getElementById('roleName').textContent;const avatarEl=document.getElementById('avatar');const avatarImg=avatarEl.querySelector('img');const avatarHTML=avatarImg?'<img src="'+avatarImg.src+'" class="h-6 w-6 rounded-full object-cover"/>':avatarEl.textContent;box.insertAdjacentHTML('beforeend','<div class= ded-2xl rounded-tl-none bg-[#e8f3ed] px-4 py-3 text-sm">'+mockAiReply(text,roleName)+'</div></div>');box.lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'});toast('AI 服务暂不可用，已切换本地回复')})};if(sessId){fn(sessId)}else{API.chat.createSession(roleId).then(function(res){var sessionId=res&&res.data&&res.data.sessionId;if(sessionId){chatSessionMap[roleId]=sessionId;fn(sessionId)}else{var t=document.getElementById('aiThinking');if(t)t.remove();var box=document.getElementById('messages');box.insertAdjacentHTML('beforeend','<div class="flex gap-3"><span class="text-2xl">'+avatarHTML+'</span><div class="rounded-2xl rounded-tl-none bg-[#e8f3ed] px-4 py-3 text-sm">'+mockAiReply(text,roleName)+'</div></div>');box.lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'});toast('未登录或 AI 服务不可用，已切换本地回复')}}).catch(function(e){var t=document.getElementById('aiThinking');if(t)t.remove();var box=document.getElementById('messages');box.insertAdjacentHTML('beforeend','<div class="flex gap-3"><span class="text-2xl">'+avatarHTML+'</span><div class="rounded-2xl rounded-tl-none bg-[#e8f3ed] px-4 py-3 text-sm">'+mockAiReply(text,roleName)+'</div></div>');box.lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'});toast('未登录或 AI 服务不可用，已切换本地回复')})}}function mockAiReply(text,roleName){if(text.indexOf('你好')>=0||text.indexOf('嗨')>=0)return'嗨！我是'+roleName+'，很高兴认识你！';if(text.indexOf('故事')>=0||text.indexOf('冒险')>=0)return'听起来真有趣！我们一起出发吧。';if(text.indexOf('害怕')>=0||text.indexOf('不敢')>=0)return'没关系，勇敢不是不害怕，我陪着你呢！';return['听起来真有趣！我们一起出发吧。','嗯嗯，继续说说看！','好的呀，我们一起想想办法吧！','你的想法很棒！'][Math.floor(Math.random()*4)]}function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function speak(){if(speakMediaRecorder&&speakMediaRecorder.state==='recording'){stopSpeakRecording();return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('当前浏览器不支持语音录制');return}var btn=document.querySelector('button[onclick="speak()"]');if(btn){btn.dataset.originalHTML=btn.innerHTML;btn.innerHTML='<iconify-icon icon="lucide:loader-2" class="animate-spin" width="18"></iconify-icon>';btn.classList.add('bg-[#c44b3a]');btn.classList.remove('bg-[#fff0e9]')}toast('正在聆听，说完再点一次结束');navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){speakStream=stream;speakChunks=[];speakMediaRecorder=new MediaRecorder(stream);speakMediaRecorder.ondataavailable=function(e){if(e.data.size>0)speakChunks.push(e.data)};speakMediaRecorder.onstop=function(){var blob=new Blob(speakChunks,{type:'audio/webm'});uploadAndRecognize(blob);speakChunks=[]};speakMediaRecorder.start()}).catch(function(err){resetSpeakBtn();toast('麦克风权限拒绝或不可用')})}function stopSpeakRecording(){if(speakMediaRecorder&&speakMediaRecorder.state==='recording'){speakMediaRecorder.stop()}if(speakStream){speakStream.getTracks().forEach(function(t){t.stop()});speakStream=null}speakMediaRecorder=null}function uploadAndRecognize(blob){var btn=document.querySelector('button[onclick="speak()"]');if(btn){btn.innerHTML='<iconify-icon icon="lucide:loader-2" class="animate-spin" width="18"></iconify-icon>';toast('正在识别语音…')}if(typeof API==='undefined'||!API.file||!API.ai){toast('API 未加载，语音识别跳过');resetSpeakBtn();return}var fd=new FormData();fd.append('file',blob,'speak.webm');fd.append('type','asr');fetch(API.BASE_URL+'/api/file/upload',{method:'POST',headers:{'Authorization':'Bearer '+(localStorage.getItem('picturebook_token')||'')},body:fd}).then(function(r){return r.json()}).then(function(res){var audioUrl=res&&res.data&&res.data.url;if(!audioUrl){toast('上传失败');resetSpeakBtn();return}return API.ai.asr(audioUrl,'zh-CN')}).then(function(asrRes){var text=asrRes&&asrRes.data&&asrRes.data.text||'';if(text){document.getElementById('chatInput').value=text;toast('识别成功：'+text.slice(0,20))}else{toast('未识别到内容')}}).catch(function(e){toast('识别失败，请用文字输入')}).finally(function(){resetSpeakBtn()})}function resetSpeakBtn(){var btn=document.querySelector('button[onclick="speak()"]');if(btn&&btn.dataset.originalHTML){btn.innerHTML=btn.dataset.originalHTML;btn.classList.remove('bg-[#c44b3a]');btn.classList.add('bg-[#fff0e9]');delete btn.dataset.originalHTML}}function toast(msg){var t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='fixed bottom-6 left-1/2 z-[100] -translate-x-1/2 rounded-xl bg-[#24312e] px-4 py-2 text-xs font-semibold text-white shadow-lg transition-opacity duration-300';document.body.appendChild(t)}t.textContent=msg;t.style.opacity='1';clearTimeout(t._timer);t._timer=setTimeout(function(){t.style.opacity='0'},2000)}
function applyRoleUI(){var user={};try{user=JSON.parse(localStorage.getItem('picturebook_user')||'{}')}catch(e){}var isChild=user.role==='child';var isParent=user.role==='parent'||(!user.role&&localStorage.getItem('picturebook_token'));var hint=document.getElementById('headerHint');var backLink=document.querySelector('header a[href="home.html"]');if(isChild){if(hint){hint.textContent=(user.nickname||user.username||'小朋友')+'，开始你的创作吧！'}if(backLink){backLink.textContent='我的首页'}toast('欢迎'+(user.nickname||user.username||'小朋友')+'来到互动故事营！')}else if(isParent){if(hint){hint.textContent='家长模式 · 观看孩子的创作空间'}if(backLink){backLink.textContent='返回首页'}}}
